<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Semantic Search - Avatar SI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <a href="/" class="brand">Avatar SI</a>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/documents">Documents</a>
            <a href="/search" class="active">AI Search</a>
            <a href="/study-plans">Study Plans</a>
            <a href="/youtube">YouTube Links</a>
        </nav>
    </header>
    
    <main class="animate-fade-in">
        <div class="glass-card">
            <h2>🔍 Ask Avatar SI</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Search your knowledge base. We use RAG techniques to find precise answers in your documents.</p>
            
            <form action="/search" method="get" style="display: flex; gap: 1rem; align-items: center;">
                <input type="text" name="query" th:value="${query}" placeholder="Ask a question or enter a keyword..." required style="margin-bottom: 0; max-width: 600px;">
                <button type="submit" class="btn">Search</button>
            </form>
        </div>
        
        <div class="glass-card" th:if="${results}">
            <h3 style="color: #60A5FA;">Search Results</h3>
            <div class="summary-box" style="font-family: monospace; white-space: pre-wrap;" th:text="${results}"></div>
        </div>
    </main>
</body>
</html>
