<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>YouTube Suggestions - Avatar SI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <a href="/" class="brand">Avatar SI</a>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/documents">Documents</a>
            <a href="/search">AI Search</a>
            <a href="/study-plans">Study Plans</a>
            <a href="/youtube" class="active">YouTube Links</a>
        </nav>
    </header>
    
    <main class="animate-fade-in">
        <div class="glass-card">
            <h2>📺 Smart YouTube Suggestions</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Enter a topic you're struggling with, and Avatar SI will suggest the best video tutorials to help you understand it.</p>
            
            <form action="/youtube" method="get" style="display: flex; gap: 1rem; align-items: center;">
                <input type="text" name="topic" th:value="${topic}" placeholder="e.g. Dynamic Programming, Photosynthesis..." required style="margin-bottom: 0; max-width: 500px;">
                <button type="submit" class="btn">Get Suggestions</button>
            </form>
        </div>
        
        <div class="glass-card" th:if="${links}">
            <h3 style="color: #60A5FA;">Recommended Videos for "<span th:text="${topic}"></span>"</h3>
            <ul style="list-style: none; padding: 0; margin-top: 1rem;">
                <li th:each="link : ${links}" style="margin-bottom: 1rem; padding: 1rem; background: rgba(0, 0, 0, 0.2); border-radius: 8px;">
                    <a th:href="${#strings.substringBefore(link, ' - ')}" target="_blank" style="color: #10B981; font-weight: 600; text-decoration: none; font-size: 1.1rem; display: block; margin-bottom: 0.5rem;" th:text="${link}"></a>
                </li>
            </ul>
        </div>
    </main>
</body>
</html>
